name: Deploy Website to Cloudflare Pages

# Builds the composed deployment artifact (Astro site + SwiftTUI DocC archive +
# WebExample WASI demo) at root-relative paths and uploads it to Cloudflare
# Pages via Wrangler.
#
# Layout of the uploaded artifact:
#   /              <- Astro site (swift-tui-site/Website/dist/)
#   /docs/         <- DocC archive
#   /webexample/   <- swift-tui-counter-demo/WebExample/pages-dist/
#
# Runs on Linux since swift-tui-org plan 2026-08-25-001 Stage 4: every step
# here (wasm cross-compile, Astro, DocC, wrangler) runs on ubuntu with the
# swiftly-managed toolchain, and the macOS runner it used to occupy was the
# org's most expensive runner class for no platform reason.

on:
  workflow_dispatch:
    inputs:
      counter_demo_ref:
        description: Public swift-tui-counter-demo branch or tag to build
        required: true
        default: "0.10.0"
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  SWIFTLY_VERSION: "1.1.3"

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-24.04
    # 60, not 30: the two heavy steps are Swift builds from scratch whenever the
    # SwiftPM/Bun cache keys move, which every version bump does. On macOS the
    # 0.3.8 release measured 859s for `Build WebExample` and 743s for `Build
    # DocC archive` on a cold cache, against 456s/408s warm the day before —
    # enough to blow a 30-minute budget. A timeout is also self-perpetuating
    # here: the job is cancelled before its `Post Cache` steps run, so the
    # cache it just paid to populate is never saved and the retry is cold
    # again. Lower this only after three cold Linux runs have been measured.
    timeout-minutes: 60

    env:
      CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'swift-tui' }}

    steps:
      - name: Checkout site
        uses: actions/checkout@v7
        with:
          path: swift-tui-site

      - name: Resolve site URL
        id: site
        shell: bash
        env:
          CF_SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${CF_SITE_URL:-}" ]; then
            printf 'url=%s\n' "$CF_SITE_URL" >> "$GITHUB_OUTPUT"
          else
            printf 'url=https://swifttui.sh\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            libcurl4-openssl-dev \
            python3 \
            unzip \
            brotli

      # binaryen from its pinned GitHub release, NOT apt: ubuntu-24.04's apt
      # package is binaryen 108 (2022), and its wasm-opt produced a bundle with a
      # 1,187-parameter function that JavaScriptCore and V8 reject ("param count
      # exceeds internal limit of 1000") on the first Linux run of this lane —
      # a real browser break, not a validator quirk. Version 130 is what the
      # macOS lane (Homebrew) and local checks have been validating against.
      - name: Install binaryen (pinned release)
        shell: bash
        env:
          BINARYEN_VERSION: "130"
          BINARYEN_SHA256: "0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc"
        run: |
          set -euo pipefail
          archive="binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/$archive"
          echo "$BINARYEN_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/$archive" -C /opt
          echo "/opt/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
          "/opt/binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt" --version

      # Validated against a strict pattern before use; see test.yml.
      - name: Resolve pinned Swift version
        id: swift
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < swift-tui-site/.swift-version)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Unexpected .swift-version contents: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Swiftly toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/swiftly
            ~/.local/bin/swiftly
          key: ${{ runner.os }}-swiftly-${{ env.SWIFTLY_VERSION }}-${{ hashFiles('swift-tui-site/.swift-version') }}
          restore-keys: |
            ${{ runner.os }}-swiftly-${{ env.SWIFTLY_VERSION }}-

      - name: Install swiftly and Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          export SWIFTLY_HOME_DIR="$HOME/.local/share/swiftly"
          export SWIFTLY_BIN_DIR="$HOME/.local/bin"
          mkdir -p "$SWIFTLY_BIN_DIR"
          export PATH="$SWIFTLY_BIN_DIR:$PATH"

          if ! command -v swiftly >/dev/null 2>&1 || [ ! -f "${SWIFTLY_HOME_DIR}/env.sh" ]; then
            tmpdir="$(mktemp -d)"
            trap 'rm -rf "$tmpdir"' EXIT
            cd "$tmpdir"
            swiftly_archive="swiftly-${SWIFTLY_VERSION}-$(uname -m).tar.gz"
            curl -fsSLO "https://download.swift.org/swiftly/linux/${swiftly_archive}"
            tar -zxf "$swiftly_archive"
            ./swiftly init --skip-install --quiet-shell-followup --assume-yes
          fi

          . "${SWIFTLY_HOME_DIR}/env.sh"
          hash -r
          swift_version="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/swift-tui-site/.swift-version")"
          swiftly install --use --assume-yes "$swift_version"
          swiftly list
          swiftly run swift --version
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR" >> "$GITHUB_ENV"
          echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/.swiftpm
            swift-tui-site/.build/public-inputs/swift-tui-counter-demo/WebExample/TerminalApp/.build
          key: ${{ runner.os }}-swiftpm-cfpages-${{ hashFiles('swift-tui-site/docs/releases.yml', 'swift-tui-site/.swift-version') }}-${{ inputs.counter_demo_ref }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-cfpages-
            ${{ runner.os }}-swiftpm-site-

      - name: Cache Bun deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            swift-tui-site/Website/node_modules
            swift-tui-site/.build/public-inputs/swift-tui-counter-demo/node_modules
            swift-tui-site/.build/public-inputs/swift-tui-counter-demo/WebExample/node_modules
          key: ${{ runner.os }}-bun-cfpages-${{ hashFiles('swift-tui-site/Website/bun.lock', 'swift-tui-site/docs/releases.yml') }}
          restore-keys: |
            ${{ runner.os }}-bun-cfpages-
            ${{ runner.os }}-bun-site-

      - name: Install wasm Swift SDK used by WebExample
        shell: bash
        env:
          SWIFT_VERSION: ${{ steps.swift.outputs.version }}
        run: |
          set -euo pipefail
          . "${SWIFTLY_HOME_DIR}/env.sh"
          case "$SWIFT_VERSION" in
            6.3.3)
              WASM_SDK_CHECKSUM="cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7"
              ;;
            *)
              echo "::error::No pinned wasm SDK checksum for Swift ${SWIFT_VERSION}"
              exit 1
              ;;
          esac
          if ! swiftly run swift sdk list | grep -q "swift-${SWIFT_VERSION}-RELEASE_wasm"; then
            swiftly run swift sdk install \
              "https://download.swift.org/swift-${SWIFT_VERSION}-release/wasm-sdk/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE_wasm.artifactbundle.tar.gz" \
              --checksum "$WASM_SDK_CHECKSUM"
          fi
          swiftly run swift sdk list

      - name: Install Website deps
        shell: bash
        working-directory: swift-tui-site/Website
        run: bun install --frozen-lockfile

      - name: Build WebExample
        shell: bash
        working-directory: swift-tui-site/Website
        env:
          SWIFTTUI_COUNTER_DEMO_REF: ${{ inputs.counter_demo_ref }}
        run: bun run build:wasm

      - name: Validate uploaded WebExample wasm parses in the browser API
        shell: bash
        working-directory: swift-tui-site/.build/public-inputs/swift-tui-counter-demo/WebExample
        run: |
          set -euo pipefail
          wasm_path="./pages-dist/TerminalApp/dist/assets/app.wasm"
          brotli --test "$wasm_path"
          bun -e 'const wasmPath = "./pages-dist/TerminalApp/dist/assets/app.wasm"; const proc = Bun.spawnSync({ cmd: ["brotli", "--decompress", "--stdout", wasmPath], stdout: "pipe", stderr: "pipe" }); if (proc.exitCode !== 0) { console.error(new TextDecoder().decode(proc.stderr)); process.exit(proc.exitCode ?? 1); } try { await WebAssembly.compile(proc.stdout); console.log(`Validated Brotli-compressed ${wasmPath}`); } catch (error) { console.error(`Failed to validate ${wasmPath}: ${error instanceof Error ? error.message : String(error)}`); process.exit(1); }'

      - name: Build Website
        shell: bash
        working-directory: swift-tui-site/Website
        env:
          ASTRO_SITE: ${{ steps.site.outputs.url }}
          ASTRO_BASE: /
        run: bun run build

      - name: Build DocC archive
        shell: bash
        working-directory: swift-tui-site
        run: Scripts/build_docc_site.sh

      - name: Compose Cloudflare Pages artifact
        shell: bash
        env:
          ARTIFACT_ROOT: ${{ github.workspace }}/swift-tui-site/_cf-pages-artifact
          DOCS_ROOT: ${{ github.workspace }}/swift-tui-site/_cf-pages-artifact/docs
          WEBEXAMPLE_ROOT: ${{ github.workspace }}/swift-tui-site/_cf-pages-artifact/webexample
        run: |
          set -euo pipefail
          rm -rf "$ARTIFACT_ROOT"
          mkdir -p "$ARTIFACT_ROOT" "$DOCS_ROOT" "$WEBEXAMPLE_ROOT"
          cp -R swift-tui-site/Website/dist/. "$ARTIFACT_ROOT/"
          cp -R swift-tui-site/Website/dist/docs/. "$DOCS_ROOT/"
          rm -rf "$DOCS_ROOT/documentation"
          rm -rf "$DOCS_ROOT/charts/documentation"
          cp -R swift-tui-site/.build/public-inputs/swift-tui-counter-demo/WebExample/pages-dist/. "$WEBEXAMPLE_ROOT/"
          wasm_path="$WEBEXAMPLE_ROOT/TerminalApp/dist/assets/app.wasm"
          if [ ! -f "$wasm_path" ]; then
            echo "::error::Missing WebExample wasm at $wasm_path"
            exit 1
          fi
          if ! brotli --test "$wasm_path"; then
            echo "::error::WebExample wasm should already be Brotli-compressed by bun run build:wasm"
            exit 1
          fi
          compressed_wasm_size="$(wc -c < "$wasm_path" | tr -d '[:space:]')"
          pages_asset_limit=$((25 * 1024 * 1024))
          if [ "$compressed_wasm_size" -ge "$pages_asset_limit" ]; then
            echo "::error::Brotli-compressed WebExample wasm is ${compressed_wasm_size} bytes"
            echo "::error::Still above Cloudflare Pages' 25 MiB single-file limit"
            exit 1
          fi
          echo "Verified Brotli-compressed WebExample wasm at ${compressed_wasm_size} bytes"
          artifact_file_count="$(find "$ARTIFACT_ROOT" -type f | wc -l | tr -d '[:space:]')"
          pages_file_limit="${CLOUDFLARE_PAGES_FILE_LIMIT:-20000}"
          echo "Cloudflare Pages artifact contains ${artifact_file_count} files"
          find "$ARTIFACT_ROOT" -mindepth 1 -maxdepth 1 -print | while IFS= read -r child; do
            count="$(find "$child" -type f | wc -l | tr -d '[:space:]')"
            echo "  ${child#$ARTIFACT_ROOT/}: ${count} files"
          done
          if [ "$artifact_file_count" -gt "$pages_file_limit" ]; then
            echo "::error::Cloudflare Pages artifact has ${artifact_file_count} files"
            echo "::error::Above the ${pages_file_limit}-file deployment limit"
            exit 1
          fi

      - name: Resolve deploy branch
        id: branch
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          printf 'branch=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        id: deploy
        shell: bash
        working-directory: swift-tui-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_BRANCH: ${{ steps.branch.outputs.branch }}
          CF_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deploy_log="$(bunx wrangler@latest pages deploy _cf-pages-artifact \
            --project-name="$CF_PROJECT" \
            --branch="$CF_BRANCH" \
            --commit-hash="$CF_COMMIT_SHA" \
            --commit-dirty=true 2>&1 | tee /dev/stderr)"
          deployment_url="$(printf '%s\n' "$deploy_log" | grep -Eo 'https://[^[:space:]]+\.pages\.dev' | tail -n1 || true)"
          printf 'deployment-url=%s\n' "${deployment_url:-}" >> "$GITHUB_OUTPUT"
