name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-test-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.13"

jobs:
  test:
    name: Site repo gate
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout site
        uses: actions/checkout@v6
        with:
          path: swift-tui-site

      - name: Install swiftly and Swift toolchain
        shell: bash
        working-directory: swift-tui-site
        run: |
          set -euo pipefail
          curl -fsSLO https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --skip-install --quiet-shell-followup --assume-yes
          . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
          hash -r
          swift_version="$(tr -d '[:space:]' < .swift-version)"
          swiftly install --use --assume-yes "$swift_version"
          swiftly run swift --version
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$HOME/.swiftly" >> "$GITHUB_ENV"

      - name: Install wasm Swift SDK
        shell: bash
        run: |
          set -euo pipefail
          if ! swiftly run swift sdk list | grep -q "swift-6.3.3-RELEASE_wasm"; then
            swiftly run swift sdk install \
              https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz \
              --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install site gate dependencies
        shell: bash
        run: brew install binaryen brotli

      - name: Run site gate
        shell: bash
        working-directory: swift-tui-site
        run: Scripts/check_site.sh
