<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="SwiftTUI gallery running on Android via SwiftTUIAndroidHost (capture preview)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46264f"/>
      <stop offset="0.55" stop-color="#7a3b3f"/>
      <stop offset="1" stop-color="#c2603a"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="150" y="86" width="760" height="980" rx="30"/>
    </clipPath>
  </defs>

  <!-- warm ambient backdrop, matching the iPhone/macOS/terminal device shots -->
  <rect width="1000" height="1000" fill="url(#bg)"/>

  <!-- phone body, bleeding off the bottom-right like the sibling captures -->
  <rect x="120" y="56" width="820" height="1000" rx="62" fill="#0b0b0e"/>
  <rect x="138" y="74" width="784" height="1000" rx="46" fill="#0d1117"/>

  <g clip-path="url(#screen)">
    <rect x="150" y="86" width="760" height="980" fill="#0d1117"/>

    <!-- Android status bar: left clock, right signal/wifi/battery, hole-punch camera -->
    <text x="190" y="138" font-family="Geist, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">9:41</text>
    <circle cx="530" cy="128" r="11" fill="#05060a"/>
    <g fill="#e6edf3">
      <rect x="788" y="120" width="22" height="16" rx="2"/>
      <path d="M822 136 a18 18 0 0 1 18 -18 v18 z"/>
      <rect x="852" y="118" width="34" height="18" rx="3"/>
      <rect x="886" y="123" width="4" height="8" rx="1"/>
    </g>

    <!-- SwiftUI nav chrome that the host paints above the cells -->
    <rect x="190" y="176" width="320" height="52" rx="26" fill="#163b5e"/>
    <text x="350" y="210" font-family="Geist, sans-serif" font-size="24" font-weight="600" fill="#6cc5ff" text-anchor="middle">Component Gallery</text>
    <text x="560" y="210" font-family="Geist, sans-serif" font-size="24" fill="#8a97a4">Details</text>

    <!-- gallery tab strip, Android-green active underline -->
    <g font-family="Geist Mono, monospace" font-size="22">
      <text x="190" y="296" fill="#3ddc84">Counter</text>
      <text x="332" y="296" fill="#5b6672">Todo</text>
      <text x="430" y="296" fill="#5b6672">Calculator</text>
      <text x="612" y="296" fill="#5b6672">Animations</text>
    </g>
    <rect x="190" y="312" width="118" height="3" rx="1.5" fill="#3ddc84"/>
    <rect x="332" y="313" width="70" height="2" rx="1" fill="#222a33"/>
    <rect x="430" y="313" width="150" height="2" rx="1" fill="#222a33"/>
    <rect x="612" y="313" width="150" height="2" rx="1" fill="#222a33"/>

    <!-- counter preview panel -->
    <rect x="190" y="356" width="630" height="430" rx="14" fill="#0b0f15" stroke="#222a33"/>
    <text x="505" y="470" font-family="Geist Mono, monospace" font-size="74" fill="#c2462f" text-anchor="middle" letter-spacing="6">TERMINALUI</text>
    <text x="505" y="512" font-family="Geist Mono, monospace" font-size="22" fill="#5b6672" text-anchor="middle">A SwiftUI-shaped terminal UI, on Android</text>

    <!-- stepper -->
    <rect x="300" y="592" width="64" height="64" rx="10" fill="#1a2029" stroke="#2b3440"/>
    <text x="332" y="635" font-family="Geist Mono, monospace" font-size="32" fill="#9aa6b2" text-anchor="middle">-</text>
    <rect x="470" y="592" width="60" height="84" rx="8" fill="#e6edf3"/>
    <rect x="492" y="628" width="16" height="12" rx="2" fill="#0d1117"/>
    <rect x="640" y="592" width="64" height="64" rx="10" fill="#1a2029" stroke="#2b3440"/>
    <text x="672" y="635" font-family="Geist Mono, monospace" font-size="32" fill="#9aa6b2" text-anchor="middle">+</text>

    <text x="300" y="730" font-family="Geist Mono, monospace" font-size="22" fill="#7a8794">Step</text>
    <line x1="372" y1="724" x2="560" y2="724" stroke="#2b3440" stroke-width="3"/>
    <circle cx="408" cy="724" r="9" fill="#3ddc84"/>
    <text x="600" y="730" font-family="Geist Mono, monospace" font-size="22" fill="#e6edf3">1</text>
    <rect x="648" y="704" width="118" height="40" rx="8" fill="#c2462f"/>
    <text x="707" y="731" font-family="Geist Mono, monospace" font-size="20" fill="#0d1117" text-anchor="middle">Reset</text>

    <!-- Android gesture nav pill -->
    <rect x="420" y="1006" width="170" height="9" rx="4.5" fill="#3a434d"/>
  </g>

  <!-- honest "render pending" marker; swapped for a real adb screencap per the capture plan -->
  <g font-family="Geist Mono, monospace">
    <rect x="690" y="900" width="232" height="34" rx="6" fill="rgba(13,17,23,0.66)" stroke="#3ddc84" stroke-opacity="0.45"/>
    <circle cx="712" cy="917" r="4" fill="#3ddc84"/>
    <text x="726" y="922" font-size="15" fill="#9aa6b2" letter-spacing="0.08em">CAPTURE PREVIEW</text>
  </g>
</svg>
